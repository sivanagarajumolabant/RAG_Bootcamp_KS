[project]
name = "vector-graph-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Homayoun", email = "hsohrab23@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langchain-openai>=0.3.28,<0.4.0",
    "langgraph>=0.5.3,<0.6.0",
    "langmem>=0.0.28,<0.0.29",
    "python-dotenv>=1.1.1,<2.0.0",
    "langchain-community>=0.3.27,<0.4.0",
    "langchain-core>=0.3.69,<0.4.0",
    "neo4j>=5.28.2,<6.0.0",
    "langchain-neo4j>=0.3.0,<0.4.0",
    "pinecone==7.2.0",
    "langchain-text-splitters>=0.3.9,<0.4.0",
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "retrieve", "config"]
